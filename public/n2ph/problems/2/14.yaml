tips:
- content: 请查看题目列表上方的图案以及题册与题卡（线下发放）N2PH：IN MACHU PICCHU的两边，每道题都对应了一个棋子。你应当通过前12道小题的题目背景或标题或题目形式或做题过程，将棋子和DEBRIS一一对应。
  title: 我毫无头绪 (500提示点)
- content: 棋子所落入的格子（例如a1）可以看做为是一种索引。（a1可以看做为单词的第一个字母是a）每一枚棋子都始终在依据其对应的DEBRIS走，根据红色或蓝色决定其依据的是DEBRIS的前一个单词还是后一个单词。
  title: DEBRIS该如何使用？ (600提示点)
- content: 根据PREMETA中画有阴影的8x8范围，提取出每一步棋子所落到的格子在PREMETA中的8x8格子所对应的位置内填有的字母。
  title: 该如何提取 (600提示点)
