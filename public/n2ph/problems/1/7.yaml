tips:
- content: 将注意力放在加重的音上。
  title: 我毫无头绪 (300提示点)
- content: 前半部分是一个重复多遍的01串，0对应低音，1对应高音。后半段有一段音数和前半段01串字符数一样的、被加重的旋律。当前面是0的时候提取那段旋律的音名，前面是1的时候提取唱名（皆提取首字母）。
  title: 该如何提取 (600提示点)
- content: '以下是音乐对应的MIDI瀑布流，你无需提取瀑布流note颜色，音乐BPM等内容，这不是Puzzle的一部分。

    [点击打开](/n2ph/static/21e4222f18244056b2b0196891c65bd0.html)


