  \n    </div>\r\n    \r\n\r\n</template>\r\n\r\n<style>\r\n\r\n\r\n    .img-main-single\
  \ {\r\n        width: auto;\r\n        max-width: 100%;\r\n        max-height: 60vh;\r\
  \n        height: auto;\r\n        border: #fff 3px solid;\r\n        border-radius:\
  \ .5rem;\r\n    }\r\n\r\n    .vue-pz-content {\r\n        border: #bbb 3px solid;\r\
  \n        background-color: #fff;\r\n        border-radius: 1rem;\r\n        margin:\
  \ 1rem;\r\n        padding: 1.2rem;\r\n    }\r\n\r\n</style>"
