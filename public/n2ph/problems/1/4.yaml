- "\r\n<!-- n2ph-1 Puzzle -->\r\n<template>\r\n\r\n    <div class=\"vue-pz-content\"\
  >\r\n        <p>\r\n            ① 用黑线围成的9个方格为一个房间，病毒不会跨房间传播，【医生】不会跨房间治疗。<br />\r\
  \n            ② 4为【患者】，会将病毒传染给其上下左右（同一个房间里）的人，被传染者若没有在③④条中被治愈，会感染并继续按此规则传播病毒。<br\
  \ />\r\n            ③ 1为【医生】，可治愈自己及上下左右的人，被治愈者不传播病毒。<br />\r\n            ④ 9为【自护者】，可治愈自己，不传播病毒。<br\
  \ />\r\n            ⑤ 阴影代表病毒感染者，空白表示未感染病毒。<br />\r\n            ⑥ 最终结果符合每行、每列、每个房间各含1~9。<br\
  \ />\r\n            ⑦ 推理出最终结果后，所有病毒全部消失。随后5变成【患者】，3变成【医生】，4变成【自护者】，请推理最新感染情况。\r\n\
  \        </p>\r\n        <p><a href=\"https://puzz.cipherpuzzles.com/penpa-edit/#m=solve&\"\
