tips:
- content: 中间答案是你在做题过程中可能会做出的一些中间步骤的结果，所有标明具有中间答案验证的题目，我们会把中间步骤所得出的结果放入判题系统中，你可以递交这些答案来检查你的中间步骤完成的是否正确。
  title: “中间答案”是什么意思 (0提示点)
- content: 你需要把这些密码翻译出来，这些密语的加密方式依次分别是：旗语、摩斯、盲文、NATO旗语。
  title: 我毫无头绪 (300提示点)
- content: 你需要找到这些单词中被数字替换的字母原来是什么。如果你不知道怎么还原这些单词，你可以使用[**Nutrimatic**](https://nutrimatic.org/)工具。用大写A表示你不知道的字母，用小写字母表示你知道的字母，然后点击Go，工具会为你找到所有的可能并且按照可能性排序。你可以递交这些词语，本题的中间答案是这四个原来的词语。
  title: 我得到了一些东西，但是我不知道下一步如何进行 (500提示点)
- content: 你需要把这些字母按照它们被替换的数字按1-9排序，并拼接成单词
  title: 该如何提取 (400提示点)
