- content: 'FT中的颜色暗示你需要找到太阳到月亮的通路，具体规则如下：

    1.太阳发射光线，月亮吸收光线

    2.镜子会反射射向镜面的光线，透过其他方向的光线

    3.乌云会遮挡光线

    4.星星棱镜会向尖端四个方向折射光线'
