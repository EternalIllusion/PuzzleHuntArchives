    group_name: 滕王阁序——唐·王勃
    group_profile: '豫章故郡，

      洪都新府。

      星分翼轸，

      地接衡庐。

      襟三江而带五湖，

      控蛮荆而引瓯越。

      物华天宝，

      龙光射牛斗之墟；

      人杰地灵，

      徐孺下陈蕃之榻。

      雄州雾列，

      俊采星驰。

      台隍枕夷夏之交，

      宾主尽东南之美。

      都督阎公之雅望，

      棨戟遥临；

      宇文新州之懿范，

      襜帷暂驻。

      十旬休假，

      胜友如云；

      千里逢迎，

      高朋满座。

      腾蛟起凤，

      孟学士之词宗；

      紫电青霜，

      王将军之武库。

      家君作宰，

      路出名区；

      童子何知，

      躬逢胜饯。

      时维九月，

      序属三秋。

      潦水尽而寒潭清，

      烟光凝而暮山紫。

      俨骖騑于上路，

      访风景于崇阿；

      临帝子之长洲，

      得天人之旧馆。

      层峦耸翠，

      上出重霄；

      飞阁流丹，

      下临无地。

      鹤汀凫渚，

      穷岛屿之萦回；

      桂殿兰宫，

      即冈峦之体势。'
