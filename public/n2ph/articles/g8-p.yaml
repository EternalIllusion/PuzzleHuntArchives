content:
- "## 第八站——萨尔坎泰（Salkantay）\r\n\r\n山脉、溪流、峡谷。我无数次梦到的故乡。\r\n\r\n故乡吗？是不是只有出生地才能被称作故乡呢……可是我忘记自己在哪出生了，一切关于父母的记忆也像凭空消失一般，只在内心深处留下空洞的回音。直到刚进小学的时候，老师让我们介绍自己的父母，我在座位上呆坐了一整节课，因为我从未听过padre和madre这两个词——我甚至不会发“r”的音，因为我向来只听说过abuelo和abuela（祖父母）；下课后同学用嬉笑着嘲讽我”como\
  \ un huérfano”；其时我更没有听说过huérfano这个词。\r\n\r\n那天我回家追问祖父，padre是什么意思，madre是什么意思，huérfano是什么意思。他先是一愣，然后叫来祖母，郑重地低声说道，是时候跟她说一说了。\r\
  \n\r\n那之后我才知道，padre是父亲，madre是母亲，huérfano是“孤儿”。\r\n\r\n我在山脚下的孤儿院度过了童年时光。眼前是五六岁的孩子，以及萨尔坎泰的山谷。溪水清得透亮，我喜欢和朋友们来水边看阳光在波光中跳跃翻飞——他们是一对兄妹，哥哥叫休奇皮利，妹妹叫休奇特尔——都是“鲜花”的意思。没有什么可玩的，我们就找了山脚下的一堵高高的石墙当作画板。我们像原始人一样，把看到的一切用我们认为最具象的方法表示出来，也学会了用划线的方式代替一些无法表达的意图。直到六岁那年，祖父祖母领养了我。他们没有孩子，消遣方式往往只是看镇上送来的报纸。他们对我很好，每次进城都会给我带一些书回来；我最喜欢那本《海蒂和爷爷》，经常把自己和海蒂自比，也求着祖父母，让他们管我叫“海蒂”——这样我就不再是“huérfano”了。\r\
  \n\r\n祖母来孤儿院接我的时候，挎着她用了一辈子的胶片机，拍了一些照片。整理她的遗物时，我发现了这张照片："
