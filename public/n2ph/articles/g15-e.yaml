content:
- "什么是压倒骆驼的最后一根稻草。我无法得知那些时而狂喜时而悲痛的祭司们，在水池的倒影和烟雾中究竟看见了什么——或许他们什么都没看见。\r\n\r\n又或许他们真的能通灵，提前预知了一切，预知了远道而来的“救世主”们，以及他们所使用的“先进文字”。\r\
  \n\r\n真正的入侵，与毁灭，始于印加人开始说西班牙语的那一刻，因此祭司们，将“语言”的预言，重新绘制、排列，隐藏在天顶。\r\n\r\n对我来说，唯一可以确定的是，即将为这片富饶的谷地绿洲带来灭顶之灾的或许就是祭司们、祖父和我看见的噩兆。\r\
  \n"
