content:
- "外界的侵入打破了原本的秩序，也带来了新的东西，包括新的技术和文化观念；至少在我的教科书上，说这客观上是一桩好事。可是祖父也满怀遗憾地跟我讲过西班牙人离开广场时的那场大雪，他的描述让我很难“主观上”相信这是一件好事：新雪在温热尚存的血液中溶解，战士们脱下的头盔上积了厚厚的白霜。远处，科罗普纳比往日更猛烈地喷涌，仿佛积压了难以言说的苦痛和哀悼；积雪边缘透出极淡的玫瑰色，悄悄为这片土地献上吊唁的鲜花。\r\
  \n\r\n祖父还告诉我，雪后的第三日，科罗普纳山顶突然滚下一道雪崩，像一条缓缓张开的伤口，把半山的积雪推入河谷。雪崩没有发出巨响，只是低沉地“咕咚”了几声，便把河道堵死。后来，那条河改道，淹没了西班牙人为赶羊而修的木桥，也淹没了他们立在山口的石制界碑。“这么看来，他们作为我的祖先，我应该感到耻辱。”祖父叹道。\r\
  \n\r\n我知道，那是山在替人说话。火山就是大地的眼睛，火替死去的眼睛继续看，雪替活着的眼睛继续哭。\r\n\r\n但我翻遍教科书，却找不到那道雪崩的记录，只在页脚的小注里读到一句：\r\
  \n\r\n> *“1547年，科罗普纳地区发生小规模火山活动，未见重大人员伤亡。”*"
