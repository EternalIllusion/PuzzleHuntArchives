content:
- "七个单词，七个字母从网格的经纬中浮现，组成多眼符号那诡异的形状。我圈出它们，每一个单词的八个字母守卫着一个中心的字母，正如八座圣山拱卫着库斯科。\r\n\r\n\
  刹那间，教堂里流动的光似乎暗了一瞬。似乎有什么，被挡住了。\r\n\r\n祖母曾告诉我，在她与祖父新婚不久后，曾有一次罕见的日食降临库斯科谷地。西班牙殖民者的后裔和残留的印加血脉子民，怀着截然不同的恐惧与敬畏，注视着太阳被黑暗吞噬。祖父紧握着她的手，用他所能找到的天文图表和历史记录，努力向她解释这现象的物理成因、周期推算，试图用理性的光芒驱散她“不必要的”神秘恐惧。他的掌心有汗，严谨的推理下，是深切的关怀，希望她“脱离蒙昧”。\r\
  \n\r\n祖母安静地听着，点头，却在他终于停顿的间隙，拉着他跑到无顶的古老庭院，指着天空说：“你看，你的神和我的神，此刻都闭上了眼睛。”在那一刻的黑暗中，没有十字架，也没有因蒂的锋芒。\r\
  \n\r\n接着，光芒迸裂，钻石环刺破黑暗，世界重生。\r\n\r\n祖父沉默了良久，只是更紧地握住了她的手。"
