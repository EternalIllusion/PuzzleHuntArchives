content:
- "## 第三站——阿空加瓜（Aconcagua）\r\n\r\n帕里亚卡卡的星光与奥桑加特的密码，并未让我感觉更接近祖父母。相反，我陷入一种更深的茫然。两种截然不同的语言，像两条并行的溪流，在我脑海里各奔东西，找不到交汇的河口。\r\
  \n\r\n行程进入第三个月，我们抵达阿空加瓜。空气稀薄，万物呈现出一种被剥离后的本质状态：岩石是岩石，雪是雪，天空是一种压迫性的湛蓝。在这里，连时间都仿佛被冻结、压扁，成了地质年表上一道冷静的划痕。\r\
  \n\r\n这种绝对的“简”，让我前所未有地想起祖父。\r\n\r\n营地灯光昏黄，我第三次翻开笔记中关于阿空加瓜的部分。没有测绘，没有地形速写，甚至没有出现“山”这个字。占据这几页的，是几幅异常干净、由极细网格构成的图案。一些方格被精确地涂黑，更多的则空白，形成一片片静止的、几何状的“菌落”。它们规整得不像自然造物，倒像是某种精密的织物纹样，或是一块被放大、并被严格编码的电路板。旁边的标注冰冷而克制：“初始态。规则。迭代。观测点记录……”以及那串令人费解的“SGA”编码。\r\
  \n\r\n它不像是在描述地球上的任何生命，更像是在记录某种在截然不同的物理规则下，于培养皿或遥远星球表面蔓延开来的、陌生的有机结构。\r\n\r\n我走出帐篷，想让清冷的空气驱散这怪诞的联想。手电筒的光柱刺破黑暗，扫过附近裸露的岩面。我下意识地寻找，寻找那些在现实中或许对应着笔记中“菌落”的东西——也许是某种地衣的斑块，也许是冰雪融蚀留下的特殊纹路。\r\
  \n\r\n帐篷在风中发出单调的鼓噪声。困意与高原反应让我的思维变得黏稠。那些黑色方格在眼帘后开始滑动、繁衍、竞争、湮灭。它们遵循着那几条被写定的、不容置疑的规则，在无限的网格上上演着无声的兴起与崩溃。\r\
  \n\r\n“SGAxxxx”的编码，像档案室深处某个铁柜上的标签，指向一份特定的记录样本。它或许就是解开这演替次序的秘密的第一个突破口。"
