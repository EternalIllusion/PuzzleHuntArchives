content:
- "好吧，看来祖母是对的。\r\n\r\n我被困在了印加覆灭的那一年，亲眼看到了祖母笔记中的一切。她总为印加的陷落而惋惜，甚至每每谈及，每每落泪。现在我倒是理解她的困境了：一个文明，拥有如此磅礴的生命、鲜活的心脏，在当时的人类之海中也曾闪着绵延的长明的辉光；然而人类的肉体终究是战胜不过机械和火药，它们在近乎残忍的枪炮与钢铁之中被时代所献祭。太阳神因蒂是永生的，他看着这片升腾的沃土上一丛又一丛树林的生长，看着安第斯山顶的雪积上又化掉，看着每一个虔诚地向他朝拜的信徒。\r\
  \n\r\n全知全能的因蒂，你何时才能重回库斯科，何时才能再次将你的圣辉播撒在印加人的心中啊。\r\n\r\n---\r\n但是——\r\n\r\n冥冥之中，我感到了一丝异样。\r\
  \n\r\n直觉告诉我，这不是全部的真相，在库斯科城的旅途中，我大抵是漏掉了什么……\r\n\r\n漏掉了什么？\r\n\r\n**或许，我应当返回库斯科城，去寻找，去寻找一条仍未被涉足的道路……**"
