content:
- "## 第一站——帕里亚卡卡（Pariacaca）\r\n\r\n印加传说中，山神帕里亚卡卡是天空和大地凝结的骨血。我的祖母，印加人的后裔，便出生在这座圣山沉默的影子里。\r\
  \n\r\n许多个黄昏，她会牵着我的手，指向被夕照熔成金红色的峰顶。“看，”她的声音总是很轻，“我是它的影子，它也是我的影子。”\r\n\r\n我仰起头，又困惑地看看脚下。“影子……不该在地上吗？”\r\
  \n\r\n她笑了，每次说些深奥难懂的话时祖母都是这副表情，自嘲？还是宽慰？她的手先是指向辉煌的山巅，随后缓缓下沉，覆上我们脚下温热的、黝黑的泥土。“我的根在这里，孩子，我属于这片实实在在的大地。但我的灵魂……”她的目光投向已然深邃起来的天空，“我的灵魂，向往着那片永远无法抵达的苍穹。它就是我在大地上，一道永恒的、残缺的倒影。我们终生互相凝视，却注定无法真正相遇。”\r\
  \n\r\n晚风渐起，第一批星辰刺破靛青色的天幕。祖母仰着脸，星光落进她清澈的眼里。“很有趣，不是吗？”她像是在自言自语，“人们追逐星光，却很少有人低下头，去想一想——这星光本身，会投下怎样的影子。”\r\
  \n\r\n童年的我自然不懂，只懵懂地望着她，再望望看似空无一物的地面，什么也找不到。\r\n\r\n许多年过去了。西班牙内战的战火，如潮汐般洗刷了山麓，抹去了山脚村庄的痕迹。祖母也像一缕倦怠的烟尘，悄然融入了群山的雾霭之中。\r\
  \n\r\n此刻，我独自站在她曾经站立的位置。村庄、战火、祖母的体温，一切具体的事物都消失了，仿佛被时间本身吸收殆尽。唯有头顶的星河，依旧以那种近乎残酷的恒常缓缓轮转，洒下冰冷的光辉。\r\
  \n\r\n但这一次，我没有仰望。\r\n\r\n祖母那句话，忽然像一颗埋藏多年的种子，在记忆最深处破土而出。我慢慢地、深深地低下头，目光投向自己被星光淡淡勾勒出的身影，投向这片被无数光年外的微光所浸染的、辽阔而寂静的荒原。\r\
  \n\r\n原来她叫我看的，从来不是光。"
