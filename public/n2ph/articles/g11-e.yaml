content:
- "什么是压倒骆驼的最后一根稻草？我无法得知，总是沉吟的祖父当年在考古现场的穹顶上的符文中究竟看见了什么——或许他什么都没看见。\r\n\r\n又或许他已经看见了过去的一切，于是，不得不将秘密重新排列，隐藏在他最熟悉的语言中，用我们心照不宣的方式记下。\r\
  \n\r\n真正的入侵，与毁灭，始于印加人开始说西班牙语的那一刻，因此祖父，把“语言”这个关键词，重新绘制、排列，隐藏在天顶。\r\n\r\n对我来说，唯一可以确定的是，西班牙人入侵的消息，在当时的印加人中传播肆虐，恰似他们带来的病菌。\r\
  \n"
