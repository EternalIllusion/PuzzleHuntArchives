content:
- "只不过，轻轻推推，即使门上了锁，推不开，仍能感受到这似乎只是一扇刷了金漆的木门。大概是现代的仿品。\r\n\r\n祖父曾经说过，他和祖母的考古团队，当初在库斯科郊外的麦田中，发现了一座神庙遗址。发掘期间，他们试图复原了部分建筑，作为研究营地，想必就是这里了。\r\
  \n\r\n门是上了锁的，但一旁的石墙上挂着一把钥匙和一张影印的、泛黄的地图，字迹已经难以辨认，但线条与图案依旧清晰——不仅清晰而且很熟悉。\r\n\r\n一路以来，如现在这般的感受实在太多，多到令我近乎本能地开始搜索自身，尝试找到那个与之相似的事物。\r\
  \n\r\n祖母和祖父共有的地图，看来这的确如我所料，正是他们的“秘密基地”。\r\n\r\n可是，我仍然不明白，如果有谁，存心为难我，为什么又要放这把钥匙呢？门的后面到底是什么？祖父，在门后吗？\r\
  \n\r\n我拿起钥匙，锁很轻松地旋开了。\r\n\r\n通向这片遗产最终秘密的大门，缓缓开启。\r\n\r\n----\r\n\r\n走进门，这似乎是考古营地的大厅。我环顾四周，一切都似曾相识。或许我小时候来过这里，但这已经不重要了。\r\
  \n\r\n大厅的一切，应该都是仿照原本神庙的样式建造的。无论是装饰风格还是纹样，都彰显着其印加风格。正如真正祭祀神明的庙宇，一切都流露着一种强烈的使人战栗的庄严。黑白相间的大理石地砖展现出极其严格的秩序、似乎只要环境是严格守序的，贸然闯入的恶灵也会因此而守序地列队退散。四角的四根石柱极威严地竦立着，上面雕有梯子的纹样，据传是为了引导驱魔后洁净的灵魂走向至高无上的天空。\r\
  \n\r\n石柱支起的天顶作了镂空，玻璃马赛克嵌入其中。彩色光束顺着石柱流向地面，泼洒出一片汪洋，把影像投入地面正中的水池。在光晕和微尘中，整个大厅像是在轻轻摇曳。\r\
  \n\r\n祖父母的那本笔记本突然啪地掉出来，手稿和拓本散了一地。兴许这挎包真是件老古董，拉链已经散了不少次。我把包反背在身前，正欲将手稿塞回去，突然瞥见右下角的一幅手绘画图，和天顶正中的那块玻璃马赛克出奇地相像。\r\
  \n\r\n浅浅的水池已经干涸，中央的高台上，堆着一些杂物，包括一本我没见过的，祖母给年轻的祖父拍摄的影集，摊开的那一页，正是祖父当年在玻璃天顶上雕刻花纹时留下的影像。\r\
  \n\r\n看来，这就是祖父留给我最后的消息了。来时，那座迷宫尽头的大门已经关上。\r\n\r\n\r\n"
