content:
- "## 第七站——科罗普纳（Coropuna）\r\n\r\n关于科罗普纳的一切故事，都是祖父告诉我的。\r\n\r\n这座躁动的火山被冰盖笼罩着，西班牙人的铁蹄沿着印加人修建的大道翻过山口，长驱直入。山脊残雪被马蹄踏成乌黑的冰渣，像被撕开的旧绷带，露出下面暗红的石脉。风从峡谷涌来，带着硫黄与羊驼血的气味。这条路的名字被改成了西班牙语，“雷亚尔”，王者之路。\r\
  \n\r\n炮声停歇时，广场在一层淡蓝色硝烟中静得可怕，只有西班牙人把俘虏赶进羊圈的呵斥声。铁锁与铁锁相撞，发出陶铃般的脆响，只是音色冷清得多。女人们用克丘亚语低声呼唤着亡夫，每人都撕下一小块衣角，系在栅栏缝隙。布条在风中颤动，远处火山口偶尔喷出暗红，布条周围浮现出若有若无的暗淡的光。\r\
  \n\r\n行刑前夜，印加俘虏们被允许进行祷告。一位老人把一小撮树叶塞进嘴里，用极低的声音呢喃：“全知全能的因蒂、我们的主：西班牙人能带走黄金，能带走我们的声音和身体，但他们刺不破我们的影子。请祢赦免我们的早逝，请祢原谅我们无法保护神圣的印加。请祢，为我们摆渡。”人们跟着念：\r\
  \n\r\n“请祢赦免我们的早逝。”\r\n\r\n“请祢原谅我们无法保护神圣的印加。”\r\n\r\n“请祢，为我们摆渡。”\r\n\r\n黎明，赤裸的印加人被绳缚着站成一排，披挂的西班牙人端着步枪也站成一排。广场积雪成了灰黑的泥，还留着前些日子激战的马蹄印和血迹。昨晚带领祷告的老人望向远处的科罗普纳火山，它仍然闪着隐约的红光。那山脊像被拉紧的弓弦，绷住整个高原的呼吸。战士们自发地唱起圣歌，那是父辈最早教会他们的东西。现在这里的居民们仍记得这首圣歌，是战士的孀妻们把它记下来，并且唱给自己的孩子们听，这样一代代传下去。\r\
  \n\r\n后来，祖父随手记下了曲谱，将其混音后录进了一张磁带。"
