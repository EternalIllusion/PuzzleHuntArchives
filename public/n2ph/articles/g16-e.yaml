content:
- "尘归尘，土归土。\r\n\r\n一阵震悚击穿我的身体。\r\n\r\n看来这里就是祖父，和印加，最后的归宿了。\r\n\r\n祖父在国际纵队的血与火中培养的直觉让他早就意识到：\r\
  \n\r\n印加终于此刻。\r\n\r\n而我也将循着他的脚步，回到此刻。\r\n"
