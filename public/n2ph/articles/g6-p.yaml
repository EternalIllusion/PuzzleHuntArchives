content:
- "## 第六站——安帕托（Ampato）\r\n\r\n离开瓦伊纳波托西，安帕托的山风像冰冷的潮水，一阵阵冲刷着裸露的岩石。在这里，方向感变得异常清晰。山脉的走势，冰川退却留下的刻痕，甚至云层流动的轨迹，都指向某种沉默的秩序。\r\
  \n\r\n我在一处背风的山坳里找到了祭祀台的遗迹。最显眼的，是五只从岩石基底中雕刻出的巨手。它们造型古朴，线条简拙，带着工具劈凿留下的粗犷痕迹。五只手，分别坚定地指向五个不同的方位，仿佛在很久以前的一次仪式中，被某种巨大的力量凝固在了“指示”的瞬间。\r\
  \n\r\n石手的表面覆盖着一层薄薄的黑褐色地衣，像是时光本身沉积下来的皮肤。我站在那里，看着这沉默的阵列，一种熟悉感混杂着陌生感悄然升起。这让我想起了祖母。\r\
  \n\r\n不是想起她具体说的话，而是想起一种氛围。在她利马的书房里，靠墙的旧木架上，除了厚重的典籍，还零星放着几件不起眼的小物件：几块颜色、形状各异的石子。有一次我问起那些石子，她并没有直接回答，而是将它们拢在掌心，轻轻摇晃，发出细微的磕碰声。\r\
  \n\r\n“有时候，”她看着掌中的石子，目光有些飘远，“提出问题的人，并不真的想知道答案。他们只是需要看清，命运——或者说，他们自己内心的倾向——究竟指着多少个方向。”\r\
  \n\r\n她将石子撒在一块靛蓝色的棉布上。石子散落开来，指向各异。“你看，每一次投掷，结果都不一样。但真正重要的，不是石子停下时指着东还是西。”她用手指轻轻划过石子指向的、那些虚无的延长线，“重要的是，在那一刻，你心里是否准备好了，接受其中的任何一种可能，并且沿着那个方向走下去。因为每一个‘此刻’所指的方向，都包含着它自己的‘未来’，以及那个未来之后……依然无法被彻底看清的余波。”\r\
  \n\r\n那时我大概十岁，听得半懂不懂，只记得石子碰撞的脆响，和蓝布上那些指向不明的、安静的石头。\r\n\r\n我翻开祖母的笔记，关于安帕托的那一页只有寥寥数行短语。她的笔迹一如既往的沉静。这些词语与眼前的石手，隔着时空，形成了奇异的对照。"
