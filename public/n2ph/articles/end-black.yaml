content:
- "好吧，看来祖父是对的。\r\n\r\n他时常喝酒，喝醉的时候总会说夹杂着克丘亚语的西班牙语，“我应当赎罪”“西班牙人坏透了”之类的话；他时常回忆过去，尤其是他在国际纵队的那段日子，那时国际纵队里的西班牙人和右翼西班牙压迫下的拉美人结成了牢不可破的联盟。没有一个西班牙人天生对印加人怀有敌意，一切苦难的根源都是殖民地总督特意设下的棋局——源自西方的象棋，印加人怎么可能下得明白？西班牙人早就想好要取缔印加文明了，这盘棋充其量算一个正当理由。只不过，**黑方的最后一步有点奇怪，至今也没有棋手能解释总督是怎么赢下这盘棋的。**\r\
  \n\r\n一切照旧。\r\n\r\n---\r\n但是——\r\n\r\n冥冥之中，我感到了一丝异样。\r\n\r\n直觉告诉我，这不是全部的真相，在库斯科城的旅途中，我大抵是漏掉了什么……\r\
  \n\r\n漏掉了什么？\r\n\r\n**或许，我应当返回库斯科城，去寻找，去寻找一条仍未被涉足的道路……**\r\n\r\n"
