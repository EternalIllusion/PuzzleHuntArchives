content:
- "我离开了大厅，返回城内。\r\n\r\n祖父把最后的消息留在迷宫里，可是祖父显然绝不会迷失在迷宫里，这一点从终点的秘密基地，便可看出。\r\n\r\n既然如此，那祖父到底在哪里？我又该如何寻找他呢？\r\
  \n\r\n包里只有最后一样东西没有用上了——祖父留给我的书单，祖父是很爱书的，他临走前曾特意叮嘱我，大学入学之前一定要读一读其中的几本。这之后，祖父带着书离开了家，走入迷宫，一去不返。\r\
  \n\r\n或许这也是祖父留给我的考古线索的一部分。那些不为人知的历史，或者祖父的下落，是否就在其中？\r\n"
