content:
- "## 第四站——尤亚亚科（Llullalliaco）\r\n\r\n世界最高的休眠火山，灰白色的峰顶终年积雪，山体仿佛一尊沉睡的巨人，仍在沉睡中散发着令人窒息的威压。尤亚亚科的轮廓出现在地平线上时，空气骤然变得稀薄而锋利。那不是普通的山峰，而是一座沉睡的巨兽，其沉默本身便是一种无言的威压，凝固的熔岩是它冰冷的黑色血脉，终年不化的雪冠则是它呼吸凝结的霜。\r\
  \n\r\n笔记的边角处，有一行极小的、几乎被忽略的铅笔字：“空气里有硫磺与……恐惧的味道。”\r\n\r\n恐惧。\r\n\r\n散落的石基、倾倒的矮墙、中央一处被精心打磨过的方形石台——上面覆盖着一层经年的浅雪。我拂去积雪。\r\
  \n\r\n石台表面，是一幅由深刻而古旧的线条构成的棋盘。不，不是棋盘。是一个网格。纵横各九，切割出八十一个规整的方格。其中一些方格内，刻着清晰的印加数字符号，另一些则是空的。但吸引我目光的，是网格之外，石板边缘那些粗犷而充满痛苦张力的浅浮雕：扭曲的人形、散落的谷物、倒在地上的羊驼、以及一个笼罩在所有图案上方的、似人非人的可怖阴影。\r\
  \n\r\n> *“就像圣经中的天启骑士一样。”*\r\n\r\n祖父的声音仿佛穿透时光。他当年站在这里，面对这幅景象时，看到的恐怕不只是祭祀图案。他看到了记录。一块石板上的印记，记录了崇敬这座雄山的坚韧的人们与瘟疫的搏斗。\r\
  \n\r\n那些刻在特定格子里的数字，是献祭的数量？是幸存者的计数？还是……疾病蔓延的节点？\r\n\r\n指尖拂过冰冷的数字刻痕，我仿佛能触摸到那个遥远下午的绝望与希冀。他们试图用秩序去理解、去框限、去对抗那场毫无道理的毁灭——这本身，就是一种以理性对抗混沌的、悲壮的努力。\r\
  \n\r\n至少他们成功了一次。笔记上，在这一页的背面，祖父用稍显凌乱的笔迹补了一句，像是一个迟来的注解。或许在某一次轮回般的灾厄中，凭借某种集体的坚守、巫医的草药、或是纯粹的好运，蔓延的“数字”被控制住了，空白重新占据了上风。希望曾短暂地照亮过这些石格。"
