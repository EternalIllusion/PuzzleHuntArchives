- "## 第五站——瓦伊纳波托西（Huayna Potosi）\r\n\r\n瓦伊纳波托西山脚下，一座几乎被藤蔓完全吞没的小型太阳观测所里，尘埃在从石缝透入的光柱中缓缓沉浮。\r\
  \n\r\n我在这里发现了祖母的另一件遗物——不是笔记，而是一个用柔软皮革包裹的沉重物件。解开系带，里面是一块镶嵌在厚重铜框中的深色石板。石板表面打磨得极其光滑，如同静止的水面，边缘蚀刻着难以辨认的细小刻度。而石板的中心，嵌着三枚宝石。\r\
  \n\r\n它们依然闪着璀璨的光芒，如同完美的光学仪器。\r\n\r\n一枚是浓烈的日曜金，一枚是清冷的月长石，最后一枚则是乌黑的曜石，表面却被打磨出无数细小的、精准的切面。三枚宝石并非随意镶嵌。铜框内侧有隐蔽的滑轨，手指轻触，宝石便能极其顺滑地在石板上沿着特定路径移动。墙上的宝石并非固定，它们可以在滑槽中移动。\
  \ 祖母的这件仪器，似乎印证了这个道理。\r\n\r\n我曾在她的工坊角落见过它，那时它盖着绒布，我以为是面华丽的镜子。此刻，高原下午强烈的阳光斜射入观测所，正好落在这石板上。我下意识地，依照某种模糊记忆中的顺序，轻轻推动那枚金色宝石。\r\
  \n\r\n金光折射，精准地打在黑色曜石的某个棱面上。\r\n\r\n一瞬间，那枚吸收所有光线的黑色宝石，仿佛从内部被点燃了。无数道锐利如刀锋的细碎光斑，从它那些微小的切面中迸发出来，投射在对面斑驳的石壁上——形成一片明亮、复杂、不断颤动的几何光纹。\r\
  \n\r\n我屏住呼吸，推动月长石。\r\n\r\n清冷的光加入，与金光交织、干涉。石壁上的光纹骤然变化，线条延伸、转折，如同有了生命和目的，向着石壁上某处早已褪色的星图痕迹蜿蜒而去。光线所经之路，分毫不差。\r\
  \n\r\n一种巨大的寂静笼罩了我。这不是装饰，也不是简单的反射。这是一种引导。\r\n\r\n祖母从未试图“创造”光路。她只是深谙光的本性——那直进、反射、折射的，不可违背的法则。她设置镜面（宝石）的位置与角度，如同设置命运的隘口。然后，松开手，让光自己去走。\r\
  \n\r\n她毕生都在学习类似的事：如何观察规律，如何安置节点，然后，敬畏地退开，看着万物（星光、季节、命运）沿着它们自身那不可抗力的轨迹运行。她是一位深邃的“设置者”，而非粗暴的“干涉者”。\r\
  \n\r\n以辅万物之自然而不敢为。"
