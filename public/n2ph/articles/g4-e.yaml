content:
- "然而，石板能记录一次胜利，却无法封印永恒的阴影。瘟疫有无数次机会。\r\n\r\n它蛰伏在时间的褶皱里，潜伏在牲畜的体内，甚至可能就沉睡在某处未腐的旧衣缕中。它耐心地等待着记忆褪色，等待着新生代长大，等待着族群再次聚集在神山的怀抱。\r\
  \n\r\n于是，它卷土重来。这一次，它更加阴险，更懂得如何摧毁一个社群的脊梁。它不再追求瞬间的、戏剧性的死亡收割，而是化为一场漫长而精密的凌迟。\r\n\r\n\
  最后的石板，与前一块的冷静克制截然不同。刻痕仓促、凌乱、深入石髓，仿佛用尽了最后的气力与希望：\r\n\r\n> *“看在因蒂的分上，救救我们！”*"
