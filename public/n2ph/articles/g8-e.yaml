content:
- "我似乎想起来了，这应该是那对兄妹，那两个阿兹特克人后裔，在墙面上的涂鸦。孤儿院里有各个民族的孩子，西班牙裔、印加裔、阿兹特克裔……如果人们可以一直像这样生活，该多好啊。\r\
  \n\r\n我们在石墙上画过很多东西：一只展开双翼的蜂鸟，喙上衔着一枚太阳；那是维齐洛波奇特利的徽记，阿兹特克人的战神，也是他们悄悄告诉我的“保护神”。蜂鸟下方，一条波浪线从墙顶垂到墙根，线里点着七颗发亮的石子；休奇皮利说，那是“萨尔坎泰的七条眼泪”，是雪山融水汇成的小溪，在夜里会唱歌。再往下，是三个手拉手的小人，中间那个戴着一顶三角草帽，那是我。最底端，歪歪扭扭的一行纳瓦特尔字母：“谢谢你，真正的安第斯人。”我们识字不多，休奇皮利却坚持把这句话留给我；他说，只有“真正的安第斯人”才看得见蜂鸟嘴里的太阳。\r\
  \n\r\n现在，我不再逃避“r”的音，也不再逃避“huérfano”这个词。因为我知道，在那堵墙里，孤儿不是被挖空的洞，而是被光穿透的缝。每个安第斯的孤儿都是祂最疼爱的孩子——无论这个孩子管太阳神叫做维齐洛波奇特利，还是因蒂。\r\
  \n\r\n火车停靠在库斯科的站台，太阳神圣殿在山头熠熠生辉。"
